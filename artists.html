<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0;url=/es/artists/" />
    <link rel="canonical" href="https://verbbe.com/es/artists/" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var key = "verbbe.lang";
        var q = new URLSearchParams(location.search).get("lang");
        var s = null;
        try { s = localStorage.getItem(key); } catch (e) {}
        var lang = q === "es" || q === "en" ? q : s === "es" || s === "en" ? s : "es";
        location.replace("/" + lang + "/artists/" + location.hash);
      })();
    </script>
  </head>
  <body>
    <p><a href="/es/artists/">Continue</a></p>
  </body>
</html>
